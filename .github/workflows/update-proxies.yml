name: Update Telegram Proxies

on:
  # Запуск по расписанию: каждые 2 часа
  schedule:
    - cron: '0 */2 * * *'
  # Возможность ручного запуска из вкладки Actions
  workflow_dispatch:

# Разрешения для токена GITHUB_TOKEN (необходимы для коммита и пуша)
permissions:
  contents: write

jobs:
  update-proxies:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка Python 3.11 с кэшированием зависимостей
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      # 4. Запуск скрипта сборщика
      - name: Run proxy updater script
        run: python update_proxies.py

      # 5. Автоматический коммит и пуш обновленного файла
      - name: Commit and Push proxies.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add proxies.json
          git commit -m "auto: update proxies" || echo "No changes to commit"
          git push
