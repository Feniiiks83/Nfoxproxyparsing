name: Update Telegram Proxies

on:
  schedule:
    - cron: '0 */2 * * *'  # Каждые 2 часа
  workflow_dispatch:        # Ручной запуск

permissions:
  contents: write

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run proxy updater script
        run: python update_proxies.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          CURRENT_BRANCH=$(git branch --show-current)
          git pull --rebase origin $CURRENT_BRANCH || true
          
          if git diff --quiet proxies.json; then
            echo "No changes to proxies.json. Skipping commit."
            exit 0
          else
            git add proxies.json
            git commit -m "chore: auto-update proxies.json [skip ci]"
            git push origin $CURRENT_BRANCH
            echo "Successfully updated and pushed proxies.json"
          fi
