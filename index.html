<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Proxy Hub | NiihoFox</title>
    <meta name="description" content="Быстрый и безопасный доступ к Telegram через MTProto и SOCKS5 прокси">
    
    <style>
        /* =========================================
           CSS VARIABLES & RESET
           ========================================= */
        :root {
            --accent-primary: #0088cc;
            --accent-secondary: #38bdf8;
            --accent-glow: rgba(0, 136, 204, 0.4);
            --gold-accent: #fbbf24;
            
            /* Dark Theme (Default) */
            --bg-color: #0f172a;
            --bg-gradient: radial-gradient(circle at 10% 20%, rgba(0, 136, 204, 0.15) 0%, transparent 40%),
                           radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 40%);
            --glass-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --card-hover: rgba(56, 189, 248, 0.1);
            
            --ping-low: #4ade80;
            --ping-mid: #facc15;
            --ping-high: #f87171;
            
            --nav-height: 70px;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --bg-gradient: radial-gradient(circle at 10% 20%, rgba(0, 136, 204, 0.08) 0%, transparent 40%),
                           radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.06);
            --glass-highlight: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --card-hover: rgba(0, 136, 204, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
            padding-bottom: 90px;
        }

        /* =========================================
           UTILITIES & GLASSMORPHISM
           ========================================= */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 20px; border-radius: 12px; border: none; font-weight: 600;
            cursor: pointer; transition: var(--transition); font-size: 0.95rem; text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white; box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
        .btn-secondary {
            background: var(--glass-highlight); color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }
        .btn-secondary:hover { background: var(--card-hover); border-color: var(--accent-secondary); }

        /* =========================================
           NAVIGATION
           ========================================= */
        .navbar {
            position: sticky; top: 0; z-index: 100; height: var(--nav-height);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; border-bottom: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px);
        }
        [data-theme="light"] .navbar { background: rgba(241, 245, 249, 0.85); }

        .logo {
            display: flex; align-items: center; gap: 10px; font-weight: 800;
            font-size: 1.25rem; color: var(--text-primary); text-decoration: none;
        }
        .logo svg { width: 32px; height: 32px; fill: var(--accent-primary); }

        .nav-tabs { display: flex; gap: 8px; }
        .nav-tab {
            padding: 8px 16px; border-radius: 10px; color: var(--text-secondary);
            text-decoration: none; font-weight: 500; transition: var(--transition);
            cursor: pointer; border: none; background: transparent; font-size: 0.95rem;
        }
        .nav-tab.active { color: var(--accent-secondary); background: rgba(56, 189, 248, 0.1); }

        .theme-toggle {
            background: transparent; border: 1px solid var(--glass-border);
            color: var(--text-primary); width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition);
        }
        .theme-toggle:hover { background: var(--card-hover); transform: rotate(15deg); }

        /* Mobile Bottom Nav */
        .mobile-nav {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border); z-index: 100;
            justify-content: space-around; align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .mobile-nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-secondary); text-decoration: none; font-size: 0.75rem;
            font-weight: 500; cursor: pointer; padding: 8px 16px; border-radius: 12px;
            transition: var(--transition); background: none; border: none;
        }
        .mobile-nav-item.active { color: var(--accent-secondary); }
        .mobile-nav-item svg { width: 24px; height: 24px; }

        /* =========================================
           SECTIONS & ANIMATIONS
           ========================================= */
        .section { display: none; animation: fadeIn 0.4s ease-out; padding: 30px 0; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           HOME TAB STYLES
           ========================================= */
        .hero { text-align: center; padding: 40px 20px; margin-bottom: 30px; }
        .hero h1 {
            font-size: 2.2rem; font-weight: 800; margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2;
        }
        .hero p { color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto 24px; line-height: 1.6; }

        /* TOP-1 Banner */
        .top-proxy-banner {
            padding: 24px; margin-bottom: 30px; position: relative; overflow: visible;
            border: 1px solid rgba(251, 191, 36, 0.3);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.05), rgba(0, 136, 204, 0.05));
        }
        .top-proxy-banner::before {
            content: '👑 ТОП-1'; position: absolute; top: 12px; right: 12px;
            background: rgba(251, 191, 36, 0.2); color: var(--gold-accent);
            padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 800;
            letter-spacing: 0.5px;
        }
        .top-proxy-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .top-proxy-flag { font-size: 3rem; }
        .top-proxy-info h3 { font-size: 1.5rem; margin-bottom: 4px; }
        .top-proxy-info .ping { font-size: 1.1rem; font-weight: 700; color: var(--ping-low); }

        /* --- FIXED GRANULAR ACTIONS --- */
        .granular-actions {
            display: grid;
            grid-template-columns: 1fr 1fr; /* IP и Порт делят строку поровну */
            gap: 10px;
            margin-top: 20px;
        }
        
        .copy-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: var(--transition);
            gap: 8px;
        }
        [data-theme="light"] .copy-chip { background: rgba(255,255,255,0.5); }
        .copy-chip:hover { border-color: var(--accent-secondary); background: var(--card-hover); }
        
        /* Секретный ключ занимает всю ширину */
        .copy-chip.secret-chip {
            grid-column: 1 / -1;
        }

        .copy-chip-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0; /* КРИТИЧЕСКИ ВАЖНО: позволяет тексту переноситься внутри flex */
        }
        
        .copy-chip-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        
        .copy-chip-value {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-all; /* Позволяет длинным IP/ключам переноситься, а не обрезаться */
            line-height: 1.3;
        }
        
        .copy-chip svg {
            width: 16px;
            height: 16px;
            color: var(--accent-secondary);
            flex-shrink: 0; /* ЗАЩИТА: иконка никогда не сожмется и не перекроется текстом */
        }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .stat-card { padding: 20px; text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--accent-secondary); margin-bottom: 4px; }
        .stat-label { color: var(--text-secondary); font-size: 0.85rem; }

        /* =========================================
           PROXY LIST STYLES
           ========================================= */
        .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; align-items: center; }
        .filter-group {
            display: flex; gap: 4px; background: var(--glass-bg); padding: 4px;
            border-radius: 12px; border: 1px solid var(--glass-border);
        }
        .filter-btn {
            padding: 8px 16px; border-radius: 8px; border: none; background: transparent;
            color: var(--text-secondary); font-weight: 500; cursor: pointer; transition: var(--transition);
        }
        .filter-btn.active { background: var(--accent-primary); color: white; }

        .search-box { flex: 1; min-width: 200px; position: relative; }
        .search-box input {
            width: 100%; padding: 10px 16px 10px 40px; border-radius: 12px;
            border: 1px solid var(--glass-border); background: var(--glass-bg);
            color: var(--text-primary); font-size: 0.95rem; outline: none; transition: var(--transition);
        }
        .search-box input:focus { border-color: var(--accent-secondary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1); }
        .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-secondary); }

        .proxy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .proxy-card { padding: 20px; transition: var(--transition); position: relative; }
        .proxy-card:hover { transform: translateY(-4px); border-color: rgba(56, 189, 248, 0.3); }

        .proxy-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .proxy-country { display: flex; align-items: center; gap: 10px; }
        .flag { font-size: 1.5rem; }
        .country-name { font-weight: 600; font-size: 1.05rem; }
        .protocol-badge {
            padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .protocol-badge.mtproto { background: rgba(0, 136, 204, 0.2); color: var(--accent-secondary); }
        .protocol-badge.socks5 { background: rgba(74, 222, 128, 0.2); color: #4ade80; }

        .proxy-card-actions { display: flex; gap: 8px; margin-top: 16px; }
        .proxy-card-actions .btn { flex: 1; padding: 8px; font-size: 0.85rem; }

        /* =========================================
           MODAL & TOAST
           ========================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
            padding: 20px; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--bg-color); border: 1px solid var(--glass-border);
            border-radius: var(--radius); padding: 30px; max-width: 400px; width: 100%;
            text-align: center; position: relative; transform: scale(0.9); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-close {
            position: absolute; top: 16px; right: 16px; background: transparent;
            border: none; color: var(--text-secondary); cursor: pointer; padding: 4px;
        }
        .qr-image { width: 220px; height: 220px; margin: 20px auto; border-radius: 12px; background: white; padding: 10px; }

        .toast-container {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            z-index: 2000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px;
        }
        .toast {
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); color: var(--text-primary);
            padding: 14px 20px; border-radius: 12px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), fadeOut 0.4s ease 2.6s forwards;
        }
        .toast.success { border-left: 4px solid var(--ping-low); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(20px); } }

        /* =========================================
           RESPONSIVE
           ========================================= */
        @media (max-width: 768px) {
            .nav-tabs, .navbar .theme-toggle { display: none; }
            .mobile-nav { display: flex; }
            body { padding-bottom: 80px; }
            .hero h1 { font-size: 1.8rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .filter-group { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .proxy-grid { grid-template-columns: 1fr; }
        }
        @media (min-width: 769px) { .mobile-theme-toggle { display: none; } }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">

    <script>

        let state = {
            proxies: [],
            filter: 'all',
            search: '',
            theme: localStorage.getItem('theme') || 'dark'
        };

        // =========================================
        // INITIALIZATION
        // =========================================
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadData();
        });

        async function loadData() {
            try {
                const response = await fetch(`proxies.json?v=${Date.now()}`);
                if (!response.ok) throw new Error('File not found');
                state.proxies = await response.json();
            } catch (e) {
                console.log('Using mock data (proxies.json not found or CORS restricted)');
                state.proxies = mockProxies;
            }
            updateStats();
            renderTopProxy();
            renderProxyList();
        }

        // =========================================
        // THEME MANAGEMENT
        // =========================================
        function initTheme() {
            document.documentElement.setAttribute('data-theme', state.theme);
            updateThemeIcons();
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', state.theme);
            localStorage.setItem('theme', state.theme);
            updateThemeIcons();
        }

        function updateThemeIcons() {
            const isDark = state.theme === 'dark';
            const iconHtml = isDark 
                ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
                : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            document.getElementById('theme-icon').innerHTML = iconHtml;
            const mobileIcon = document.getElementById('mobile-theme-icon');
            if (mobileIcon) mobileIcon.innerHTML = iconHtml;
        }

        // =========================================
        // NAVIGATION & FILTERS
        // =========================================
        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            
            document.querySelectorAll('.nav-tab, .mobile-nav-item').forEach(tab => {
                if(tab.dataset.tab) tab.classList.toggle('active', tab.dataset.tab === tabName);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setFilter(protocol) {
            state.filter = protocol;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(protocol === 'all' ? 'Все' : protocol));
            });
            renderProxyList();
        }

        function handleSearch(query) {
            state.search = query.toLowerCase();
            renderProxyList();
        }

        // =========================================
        // RENDERING LOGIC
        // =========================================
        function updateStats() {
            const online = state.proxies.filter(p => p.status === 'online');
            const total = online.length;
            const avgPing = total > 0 ? Math.round(online.reduce((acc, p) => acc + p.ping, 0) / total) : 0;
            const now = new Date();
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-ping').textContent = avgPing + ' ms';
            document.getElementById('stat-update').textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function getPingClass(ping) {
            if (ping < 150) return 'ping-low';
            if (ping < 300) return 'ping-mid';
            return 'ping-high';
        }

        function getProxyLink(p) {
            if (p.protocol === 'MTProto') {
                return `https://t.me/proxy?server=${p.ip}&port=${p.port}&secret=${p.secret}`;
            }
            return `https://t.me/socks?server=${p.ip}&port=${p.port}`;
        }

        function renderTopProxy() {
            const container = document.getElementById('topProxyContainer');
            const mtprotoOnline = state.proxies.filter(p => p.protocol === 'MTProto' && p.status === 'online');
            
            if (mtprotoOnline.length === 0) {
                container.innerHTML = '<div class="glass" style="padding:20px; text-align:center; color:var(--text-secondary);">Нет доступных MTProto прокси для отображения в ТОП-1</div>';
                return;
            }

            const best = mtprotoOnline.reduce((prev, curr) => prev.ping < curr.ping ? prev : curr);
            const link = getProxyLink(best);

            container.innerHTML = `
                <div class="top-proxy-banner glass">
                    <div class="top-proxy-header">
                        <div class="top-proxy-flag">${best.flag}</div>
                        <div class="top-proxy-info">
                            <h3>${best.country} (MTProto)</h3>
                            <div class="ping" style="color: var(--ping-low)">⚡ ${best.ping} ms — Самый быстрый сервер</div>
                        </div>
                    </div>
                    
                    <div class="granular-actions">
                        <div class="copy-chip" onclick="copyToClipboard('${best.ip}', 'IP-адрес скопирован!')">
                            <div class="copy-chip-content">
                                <div class="copy-chip-label">Сервер (IP)</div>
                                <div class="copy-chip-value">${best.ip}</div>
                            </div>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </div>
                        <div class="copy-chip" onclick="copyToClipboard('${best.port}', 'Порт скопирован!')">
                            <div class="copy-chip-content">
                                <div class="copy-chip-label">Порт</div>
                                <div class="copy-chip-value">${best.port}</div>
                            </div>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </div>
                        <div class="copy-chip secret-chip" onclick="copyToClipboard('${best.secret}', 'Секретный ключ скопирован!')">
                            <div class="copy-chip-content">
                                <div class="copy-chip-label">Секретный ключ</div>
                                <div class="copy-chip-value">${best.secret}</div>
                            </div>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 20px;">
                        <button class="btn btn-primary" style="flex: 2;" onclick="window.open('${link}', '_blank')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                            Подключить
                        </button>
                        <button class="btn btn-secondary" style="flex: 1;" onclick="copyToClipboard('${link}', 'Полная ссылка скопирована!')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Ссылка
                        </button>
                        <button class="btn btn-secondary" style="flex: 1;" onclick="showQR('${link}')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            QR
                        </button>
                    </div>
                </div>
            `;
        }

        function renderProxyList() {
            const grid = document.getElementById('proxyGrid');
            grid.innerHTML = '';
            
            let filtered = state.proxies.filter(p => {
                const matchProtocol = state.filter === 'all' || p.protocol === state.filter;
                const matchSearch = p.country.toLowerCase().includes(state.search) || p.ip.includes(state.search);
                return matchProtocol && matchSearch && p.status === 'online';
            });
            
            filtered.sort((a, b) => a.ping - b.ping);
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-secondary);">Серверы не найдены. Попробуйте изменить фильтры.</div>';
                return;
            }
            
            filtered.forEach(p => {
                const pingClass = getPingClass(p.ping);
                const isMtproto = p.protocol === 'MTProto';
                const link = getProxyLink(p);
                
                const card = document.createElement('div');
                card.className = 'proxy-card glass';
                card.innerHTML = `
                    <div class="proxy-header">
                        <div class="proxy-country">
                            <span class="flag">${p.flag}</span>
                            <span class="country-name">${p.country}</span>
                        </div>
                        <span class="protocol-badge ${isMtproto ? 'mtproto' : 'socks5'}">${p.protocol}</span>
                    </div>
                    
                    <div class="granular-actions" style="margin-top: 0; margin-bottom: 16px;">
                        <div class="copy-chip" onclick="copyToClipboard('${p.ip}', 'IP скопирован!')">
                            <div class="copy-chip-content">
                                <div class="copy-chip-label">Сервер (IP)</div>
                                <div class="copy-chip-value">${p.ip}</div>
                            </div>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </div>
                        <div class="copy-chip" onclick="copyToClipboard('${p.port}', 'Порт скопирован!')">
                            <div class="copy-chip-content">
                                <div class="copy-chip-label">Порт</div>
                                <div class="copy-chip-value">${p.port}</div>
                            </div>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </div>
                        ${isMtproto ? `
                        <div class="copy-chip secret-chip" onclick="copyToClipboard('${p.secret}', 'Секретный ключ скопирован!')">
                            <div class="copy-chip-content">
                                <div class="copy-chip-label">Секретный ключ</div>
                                <div class="copy-chip-value">${p.secret}</div>
                            </div>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </div>` : ''}
                    </div>
                    
                    <div class="proxy-card-actions">
                        <button class="btn btn-primary" onclick="window.open('${link}', '_blank')">
                            Подключить
                        </button>
                        <button class="btn btn-secondary" onclick="copyToClipboard('${link}', 'Полная ссылка скопирована!')" title="Копировать ссылку">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                        <button class="btn btn-secondary" onclick="showQR('${link}')" title="Показать QR">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // =========================================
        // ACTIONS: COPY, TOAST, QR
        // =========================================
        function copyToClipboard(text, successMessage) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast(successMessage)).catch(() => fallbackCopy(text, successMessage));
            } else {
                fallbackCopy(text, successMessage);
            }
        }

        function fallbackCopy(text, successMessage) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMessage);
            } catch (err) {
                showToast('Ошибка копирования', 'error');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' 
                ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>'
                : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
            
            toast.innerHTML = `${icon}<span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function showQR(url) {
            const modal = document.getElementById('qrModal');
            const img = document.getElementById('qrImage');
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(url)}`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            if (!event || event.target.id === 'qrModal' || event.target.closest('.modal-close')) {
                document.getElementById('qrModal').classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
